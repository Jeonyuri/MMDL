# ============================================================
# Final run config: final_16k.yaml
# Base = mmmu_eval.yaml (seed 3407 = official Qwen3-VL Instruct recipe, presence_penalty 1.5,
# baseline prompt = Qwen build_mmmu_prompt). Only max_new_tokens differs: 8192 -> 16384.
# Reason: 8k truncates ~12-15% of responses; with the v2 parser 16k gave +2.7 pts over 8k (seed 42, p=0.018).
# Run: --config configs/final_16k.yaml --seed 3407  (do not edit this file after the final run).
# ============================================================

# Protocol defaults. Changing these produces a different evaluation protocol.
model_path: Qwen/Qwen3-VL-4B-Instruct
model_revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
dtype: bfloat16
dataset_path: MMMU/MMMU
dataset_revision: 98e6ac0cb9b7b2cd2c991b85a50762edc4aedc68
split: validation
subjects:
  - Accounting
  - Agriculture
  - Architecture_and_Engineering
  - Art
  - Art_Theory
  - Basic_Medical_Science
  - Biology
  - Chemistry
  - Clinical_Medicine
  - Computer_Science
  - Design
  - Diagnostics_and_Laboratory_Medicine
  - Economics
  - Electronics
  - Energy_and_Power
  - Finance
  - Geography
  - History
  - Literature
  - Manage
  - Marketing
  - Materials
  - Math
  - Mechanical_Engineering
  - Music
  - Pharmacy
  - Physics
  - Psychology
  - Public_Health
  - Sociology
expected_per_subject: 30
expected_total: 900
backend: vllm
max_model_len: 24576 # 입력 최대 약 6,700 + 출력 16,384 = 23,084 < 24576
max_new_tokens: 16384 # 모델 카드의 VL 권장 out_seq_length=16384. 8192에서 12~15% 잘림 → 16384로 완화 (입력 최대 약 6.7k + 16.4k = 23.1k < max_model_len 24576)
temperature: 0.7
top_p: 0.8
top_k: 20
repetition_penalty: 1.0
presence_penalty: 1.5
seed: 3407
min_pixels: 1310720 # 1280 * 32 * 32 → 이미지당 1,280 토큰
max_pixels: 5242880 # 5120 * 32 * 32 → 이미지당 5,120 토큰
limit_mm_per_prompt: {image: 10}
gpu_memory_utilization: 0.9
open_question_mode: qwen_mc
prompt:
  role: user
  system: null
  content_order: images_first
  question_template: "Question: {question}\n"
  options_header: "Options:\n"
  option_template: "{letter}. {opt}\n"
  instruction: "Please select the correct answer from the options above. \n"
  rstrip: true
parser:
  version: qwen_rules_regex_v1
  order: [option, text, regex, unparsed]
  regex: '(?i:\banswer\s*(?:is\s*:?|:)\s*)\(?([A-I])\)?(?!\w)|\*\*([A-I])\*\*'
  regex_selection: last_valid_match
  unparsed_is_incorrect: true
  refusal_is_incorrect: true
official_reference_percent: 67.4
